name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_APP_URL: https://build.invalid.local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify project history
        run: npm run evolution:history

      # Only the in-repository service contract suite runs in GitHub CI.
      # The real Daily Report V2 checkout is covered by the explicit local
      # `npm run test:cross-project` command instead of a developer path.
      - name: Service contract tests (no external workspace)
        run: npm test

      - name: Build
        run: npm run build
