<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,t=0,last=null;const toggle=$('toggle'),speed=$('speed');function sync(){toggle.textContent=paused?'继续骑行':'暂停动画';toggle.setAttribute('aria-pressed',String(paused));}sync();toggle.addEventListener('click',()=>{paused=!paused;sync();});speed.addEventListener('input',()=>{$('rate').textContent=Number(speed.value).toFixed(1)+'×';});function draw(){const a=t*3.4,deg=a*180/Math.PI,bob=Math.sin(a*2)*2;const x=477+34*Math.cos(a),y=464+34*Math.sin(a),fx=954-x,fy=928-y; $('rider').setAttribute('transform',`translate(0 ${bob})`);$('rearSpokes').setAttribute('transform',`translate(334 464) rotate(${deg})`);$('frontSpokes').setAttribute('transform',`translate(667 464) rotate(${deg})`);$('nearLeg').setAttribute('d',`M447 319 Q420 360 451 388 L${x} ${y-7}`);$('farLeg').setAttribute('d',`M431 320 Q469 354 480 382 L${fx} ${fy-7}`);$('crank').setAttribute('d',`M${fx} ${fy}L${x} ${y}`);for(const [id,px,py] of [['nearFoot',x,y],['farFoot',fx,fy]])$(id).setAttribute('d',`M${px-12} ${py-11}q7 5 17 1l14 9h-37Z`);$('pedals').setAttribute('d',`M${x-16} ${y+3}h33M${fx-16} ${fy+3}h33`);$('roadmarks').setAttribute('transform',`translate(${-((t*110)%180)} 0)`);$('clouds').setAttribute('transform',`translate(${-((t*9)%1120)} 0)`);$('plants').setAttribute('transform',`translate(${-((t*110)%1120)} 0)`);$('scarf').setAttribute('d',`M492 215Q450 ${208+Math.sin(a)*7} 422 ${183+Math.sin(a-1)*10}L408 ${210+Math.sin(a-1)*10}Q445 ${237+Math.sin(a)*7} 495 231`);} // Duplicate scenery keeps the loop seamless.
for(const id of ['clouds','plants']){const g=$(id),copy=document.createElementNS('http://www.w3.org/2000/svg','g');copy.innerHTML=g.innerHTML;copy.setAttribute('transform','translate(1120 0)');g.appendChild(copy);}function frame(now){if(last!==null&&!paused)t+=Math.min((now-last)/1000,.05)*Number(speed.value);last=now;draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{last=null;});})();
</script></body></html>
